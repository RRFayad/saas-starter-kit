name: CI

# Pull requests, plus pushes to main. Other branch pushes are covered by their
# pull request, so they would only run twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Lint, plus type checks for the Next.js app, the API, and @app/shared.
      - run: npm run check
